# maxHops: -1 means "no limit" here too.
query: >
  MATCH (a:Node {name: "A"})
  CALL path.expand_config(a, {maxHops: -1})
  YIELD result
  WITH result ORDER BY size(nodes(result)), [n IN nodes(result) | n.name]
  RETURN [n IN nodes(result) | n.name] AS names;

output:
  - names: ["A"]
  - names: ["A", "B"]
  - names: ["A", "B", "C"]
