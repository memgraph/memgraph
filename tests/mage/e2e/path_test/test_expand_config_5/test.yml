# NODE_PATH forbids a node repeating within one path, where the default RELATIONSHIP_PATH only
# forbids a relationship repeating. On this two-node graph both admit the same paths.
query: >
  MATCH (a:Node {name: "A"})
  CALL path.expand_config(a, {maxHops: 5, uniqueness: 'NODE_PATH'})
  YIELD result
  WITH result ORDER BY size(nodes(result)), [n IN nodes(result) | n.name]
  RETURN [n IN nodes(result) | n.name] AS names;

output:
  - names: ["A"]
  - names: ["A", "B"]
