# A node filter entry that is neither a node nor an integer ID is rejected.
query: >
  MATCH (a:A)
  CALL path.subgraph_nodes(a, {denylistNodes: ['B'], maxHops: 5})
  YIELD nodes
  RETURN nodes.name AS name ORDER BY name ASC;

exception_contains: >
  Node filter list entries need to be a node or an integer ID.
