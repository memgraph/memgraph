query: >
  MATCH (a:A) CALL path.expand(a, ["R>"], ["+B"], 0, 5) YIELD result RETURN
  result ORDER BY size(nodes(result));
output:
  - result:
      nodes:
        - labels:
            - A
          properties:
            name: A
      relationships: []
  - result:
      nodes:
        - labels:
            - A
          properties:
            name: A
        - labels:
            - B
          properties:
            name: B
      relationships:
        - label: R
          properties: {}
