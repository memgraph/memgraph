# The depth refusal has to hold in both modes. The breadth-first walk does not recurse, so the stack
# is not what bounds it -- it keeps a partial path per branch instead, and an unbounded walk exhausts
# memory rather than the stack. `test_expand_config_10` pins the same guard for `bfs: false`; this
# one leaves `bfs` at its default so the mode most callers get is the one under test.
#
# minHops is past the end of the chain for the reason given in that test: without it the walk emits
# at every depth, which is quadratic in the chain length and fails on memory before reaching here.
query: >
  MATCH (a:Deep),(b:Deep) WHERE b.i = a.i + 1 CREATE (a)-[:R]->(b)
  WITH count(*) AS _
  MATCH (start:Deep {i: 0})
  CALL path.expand_config(start, {relationshipFilter: ['R>'], minHops: 5001})
  YIELD result
  RETURN count(*);

exception_contains: >
  Path expansion exceeded the maximum depth of 5000
