# A bare '>' stays valid and means every type, outgoing -- X hangs off an inbound edge and must
# stay out.
query: >
  MATCH (a:Node {name: "A"})
  CALL path.subgraph_nodes(a, {relationshipFilter: ['>'], maxHops: 5})
  YIELD nodes
  RETURN nodes.name AS name ORDER BY name ASC;

output:
  - name: A
  - name: B
  - name: C
