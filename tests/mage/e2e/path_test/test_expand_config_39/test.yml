# Commas make a relationship filter a repeating sequence, one step per hop: NEXT> out of the start
# node, then an incoming FROM, then POSTED>, then round again. Without the sequence reading, the whole
# string names one type that no relationship carries.
query: >
  MATCH (p:Post {name: "P1"})
  CALL path.expand_config(p, {minHops: 0, maxHops: 4, relationshipFilter: 'NEXT>,<FROM,POSTED>'})
  YIELD result
  WITH [n IN nodes(result) | n.name] AS names ORDER BY size(names), names
  RETURN names;

output:
  - names: ["P1"]
  - names: ["P1", "R1"]
  - names: ["P1", "RB"]
  - names: ["P1", "R1", "A1"]
  - names: ["P1", "R1", "A1", "P2"]
  - names: ["P1", "R1", "A1", "P2", "R2"]
