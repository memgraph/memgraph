# As test_expand_config_bfs_matches_dfs, under NODE_PATH: the breadth-first walk keys its branches by
# node rather than by relationship, so the set of paths is pinned for that bookkeeping too.
query: >
  MATCH (s:Node {name: "S"})
  CALL path.expand_config(s, {bfs: true, uniqueness: "NODE_PATH", minHops: 1, maxHops: 4}) YIELD result
  WITH collect([n IN nodes(result) | n.name]) AS breadth_first
  MATCH (s:Node {name: "S"})
  CALL path.expand_config(s, {bfs: false, uniqueness: "NODE_PATH", minHops: 1, maxHops: 4}) YIELD result
  WITH breadth_first, collect([n IN nodes(result) | n.name]) AS depth_first
  RETURN size(breadth_first) = size(depth_first)
     AND all(p IN breadth_first WHERE p IN depth_first) AS same_paths;

output:
  - same_paths: true
