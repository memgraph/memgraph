# A blank step would match everything, which reads as a stray comma rather than as a filter, so it is
# named and its position given -- as a bare '|' piece already is.
query: >
  MATCH (p:Post {name: "P1"})
  CALL path.expand_config(p, {maxHops: 2, labelFilter: 'Post,,Reply'})
  YIELD result
  RETURN result;

exception_contains: >
  Config key 'labelFilter' has a blank step at position 2
