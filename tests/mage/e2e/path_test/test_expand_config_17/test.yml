# `terminatorNodes` is the identity counterpart of a '/' label: the node is returned and the walk
# stops there, so nothing beyond D is reported and D itself is never expanded through.
query: >
  MATCH (a:Node {name: "A"}), (d:Node {name: "D"})
  CALL path.expand_config(a, {maxHops: 4, terminatorNodes: [d]})
  YIELD result
  WITH [n IN nodes(result) | n.name] AS names ORDER BY size(names), names
  RETURN names;

output:
  - names: ["A", "E", "D"]
  - names: ["A", "B", "C", "D"]
