# `sequence` supersedes the two filter keys, but it does not excuse them from being the type they have to
# be -- a caller who mistypes one alongside a sequence is told which key is wrong, not left with a filter
# that was quietly dropped.
query: >
  MATCH (p:Post {name: "P1"})
  CALL path.expand_config(p, {maxHops: 2, sequence: 'Post, NEXT>', labelFilter: 42})
  YIELD result
  RETURN result;

exception_contains: >
  Config key 'labelFilter' needs to be a string or a list of strings.
