# The same shortfall reached through `sequence` rather than `relationshipFilter`, and the error names the
# key that was actually written: the sequence's one relationship step is spent on the hop out of the start
# node, leaving nothing to repeat.
query: >
  MATCH (s:Start {name: "S"})
  CALL path.expand_config(s, {maxHops: 3, sequence: 'R>, A', beginSequenceAtStart: false})
  YIELD result
  RETURN result;

exception_contains: >
  the relationship steps of 'sequence' need a further one to repeat
