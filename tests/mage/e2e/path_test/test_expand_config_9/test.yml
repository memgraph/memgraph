# A label longer than the small-string buffer must filter exactly like a short one; the parsed
# filter used to keep views into a list that was already gone, so long labels matched nothing.
query: >
  MATCH (a:Node {name: "A"})
  CALL path.expand_config(a, {labelFilter: ['+MiddleLabelLongerThanSso'], maxHops: 5})
  YIELD result
  WITH result ORDER BY size(nodes(result)), [n IN nodes(result) | n.name]
  RETURN [n IN nodes(result) | n.name] AS names;

output:
  - names: ["A"]
  - names: ["A", "B"]
