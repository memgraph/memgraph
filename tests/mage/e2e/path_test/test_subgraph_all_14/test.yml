# allowlistNodes: only B and C may be traversed; the unfiltered start node is exempt from the list.
query: >
  MATCH (n) WHERE n.name IN ['B', 'C']
  WITH collect(n) AS allow
  MATCH (a:A)
  CALL path.subgraph_all(a, {allowlistNodes: allow, maxHops: 5})
  YIELD nodes, rels
  UNWIND nodes AS node
  WITH rels, node ORDER BY node.name
  WITH collect(node) AS nodes, rels
  UNWIND rels AS rel
  WITH nodes, rel ORDER BY rel.seq
  RETURN nodes, collect(rel) AS rels;

output:
  - nodes:
      - labels:
          - A
        properties:
          name: A
      - labels:
          - B
        properties:
          name: B
      - labels:
          - C
        properties:
          name: C
    rels:
      - label: R
        properties:
          seq: 1
      - label: R
        properties:
          seq: 2
