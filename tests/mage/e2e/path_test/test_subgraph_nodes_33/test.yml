# A marker decides the direction wherever it sits and '<' wins over '>', so '<>' names every type,
# incoming. A has no incoming relationship, so only A itself comes back.
query: >
  MATCH (a:Node {name: "A"})
  CALL path.subgraph_nodes(a, {relationshipFilter: ['<>'], maxHops: 3})
  YIELD nodes
  RETURN nodes.name AS name ORDER BY name ASC;

output:
  - name: A
