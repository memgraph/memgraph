query: >
  CALL {
    MATCH (a:Node {id: 'a'})
    MATCH (b:Node {id: 'b'})
    WITH [a, b] AS nodes
    MATCH (n)-[r]-(m) WHERE n IN nodes AND m IN nodes
    WITH nodes, collect(DISTINCT r) AS rels
    CALL refactor.clone_subgraph(nodes, rels, {skipProperties: ['id']})
    YIELD output, error
    RETURN output, error
  }
  RETURN count(output) AS cloned, count(error) AS errors;

output:
  - cloned: 2
    errors: 0
