memgraph_query: >
  MATCH (:Person)-[friends:FRIENDS]->(:Person)
  CALL create.set_rel_properties(friends, ["good_friends"], [null])
  YIELD relationship;

neo4j_query: >
  MATCH (:Person)-[friends:FRIENDS]->(:Person)
  CALL apoc.create.setRelProperties(friends, ["good_friends"], [null])
  YIELD rel
  RETURN rel;
