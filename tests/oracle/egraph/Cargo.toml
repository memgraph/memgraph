[package]
name = "egraph_oracle"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dev-dependencies]
proptest = "1"

[profile.release]
panic = "abort"
debug = true

[profile.dev]
panic = "abort"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
