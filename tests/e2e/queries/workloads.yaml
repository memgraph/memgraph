queries_cluster: &queries_cluster
  cluster:
    main:
      args: ["--bolt-port", "7687", "--log-level=TRACE", "--storage-properties-on-edges"]
      log_file: "queries.log"
      setup_queries: []
      validation_queries: []


workloads:
  - name: "Queries validation"
    binary: "tests/e2e/pytest_runner.sh"
    args: ["queries/queries.py"]
    <<: *queries_cluster

  - name: "Dump float round-trip"
    binary: "tests/e2e/pytest_runner.sh"
    args: ["queries/dump_float_roundtrip.py"]
    <<: *queries_cluster

