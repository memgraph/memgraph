name: "Package mage (External)"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

on:
  #push:
  workflow_dispatch:
    inputs:
      pr_number:
        type: string
        required: true
        description: "PR number."
      base_master:
        type: boolean
        description: "Base master?"
        default: false
      build_arch:
        type: choice
        description: "Mage build architecture"
        default: 'amd'
        options:
          - "amd"
          - "arm"
      memgraph_download_link:
        description: "Memgraph package download link (DEB). Leave empty to build memgraph inside the job."
        default: ""
        type: string
      memgraph_rpm_download_link:
        description: "Memgraph package download link (RPM)"
        default: ""
        type: string
      memgraph_debuginfo_download_link:
        description: "Memgraph debuginfo package download link (DEB). Required when memgraph_download_link is set (the debug MAGE image needs it)."
        default: ""
        type: string
      cuda:
        type: boolean
        description: "Build the image for CUDA"
        default: false
      cugraph:
        type: boolean
        description: "Build the image for CuGraph"
        default: false
      push_to_s3:
        type: boolean
        description: "Push the image to S3?"
        default: false
      s3_dest_dir:
        type: string
        description: "Destination directory in S3 bucket"
        default: "mage-unofficial"
      matrix_build:
        type: boolean
        description: "Enable multiple builds via a matrix configuration?"
        default: false
      malloc:
        type: boolean
        description: "Use malloc build of memgraph (no jemalloc)"
        default: false
      run_smoke_tests:
        type: boolean
        description: "Run smoke tests on images after building"
        default: false
      run_tests:
        type: boolean
        description: "Run MAGE tests (unit/e2e) after building"
        default: false
      os:
        type: choice
        description: Build container distro
        default: ubuntu-24.04
        # Only Python-3.12 distros are currently supported (MAGE's deps are
        # cp312-only); see tools/ci/package_mage_setup.py for the full note.
        options:
          - ubuntu-24.04
          - centos-9
          - centos-10


run-name: "Package MAGE"

jobs:
  CallCreateStagingBranch:
    uses: ./.github/workflows/create_staging_branch.yaml
    with:
      pr_number: ${{ inputs.pr_number }}
      base_master: ${{ inputs.base_master }}
    secrets: inherit

  TriggerPackageWorkflow:
    needs: CallCreateStagingBranch
    uses: ./.github/workflows/package_mage.yaml
    with:
      build_arch: ${{ inputs.build_arch }}
      memgraph_download_link: ${{ inputs.memgraph_download_link }}
      memgraph_rpm_download_link: ${{ inputs.memgraph_rpm_download_link }}
      memgraph_debuginfo_download_link: ${{ inputs.memgraph_debuginfo_download_link }}
      cuda: ${{ inputs.cuda }}
      cugraph: ${{ inputs.cugraph }}
      push_to_s3: ${{ inputs.push_to_s3 }}
      s3_dest_dir: ${{ inputs.s3_dest_dir }}
      matrix_build: ${{ inputs.matrix_build }}
      malloc: ${{ inputs.malloc }}
      run_smoke_tests: ${{ inputs.run_smoke_tests }}
      run_tests: ${{ inputs.run_tests }}
      os: ${{ inputs.os }}
      ref: ${{ needs.CallCreateStagingBranch.outputs.staging_branch }}
    secrets: inherit

  UpdatePRComment:
    continue-on-error: true  # NOTE: older branches may not have the code to create this comment
    needs: [CallCreateStagingBranch, TriggerPackageWorkflow]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Update PR comment with package results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.TriggerPackageWorkflow.result }}" == "success" ]; then
            status="true"
            echo "✅ Package workflow completed successfully"
          else
            status="false"
            echo "❌ Package workflow failed"
          fi

          python3 ./tools/ci/external-contributions/pr_comment_update.py \
            "${{ needs.CallCreateStagingBranch.outputs.comment_id }}" \
            "${{ github.event.inputs.pr_number }}" \
            "${{ needs.CallCreateStagingBranch.outputs.staging_branch }}" \
            "$status"

  CleanupStagingBranch:
    needs: [CallCreateStagingBranch, TriggerPackageWorkflow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Cleanup staging branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tools/ci/external-contributions/cleanup_staging_branch.sh \
          "${{ needs.CallCreateStagingBranch.outputs.staging_branch }}"
