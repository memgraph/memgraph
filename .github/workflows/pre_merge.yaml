name: "Pre-merge Checks"

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, milestoned, demilestoned]
  merge_group:

# Label and milestone changes come in bursts, so only the latest run matters.
concurrency:
  group: pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  CheckPR:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR labels and release note
        uses: memgraph/pr-checker@c8cb26392f21bb6d05c0e34f57c9bd867f4c8bb4  # v1.1.0
        with:
          github-token: ${{ github.token }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          docs-labels: Docs unnecessary,Docs - changelog only,Docs needed
          type-labels: ""
          skip-release-note-label: Docs unnecessary
