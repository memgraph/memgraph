name: "Diff"
concurrency:
  group: ${{ inputs.ref || github.head_ref || github.sha }}
  cancel-in-progress: true

on:
  merge_group:
  pull_request:
  workflow_dispatch:
    inputs:
      community_core:
        type: boolean
        default: true
        description: "Community: Core"
      coverage_core:
        type: boolean
        default: true
        description: "Coverage: Core"
      coverage_clang_tidy:
        type: boolean
        default: true
        description: "Coverage: Clang-Tidy"
      debug_core:
        type: boolean
        default: true
        description: "Debug: Core"
      debug_integration:
        type: boolean
        default: true
        description: "Debug: Integration"
      jepsen_core:
        type: boolean
        default: true
        description: "Jepsen: Core"
      release_core:
        type: boolean
        default: true
        description: "Release: Core"
      release_benchmark:
        type: boolean
        default: true
        description: "Release: Benchmark"
      release_e2e:
        type: boolean
        default: true
        description: "Release: E2E"
      release_stress:
        type: boolean
        default: true
        description: "Release: Stress"
      mage_amd:
        type: boolean
        default: true
        description: "MAGE: AMD"
      mage_arm:
        type: boolean
        default: true
        description: "MAGE: ARM"
      mage_cuda:
        type: boolean
        default: true
        description: "MAGE: CUDA"
      mgcxx_unit:
        type: boolean
        default: true
        description: "MGCXX: Unit"
      python_build_version:
        type: string
        default: ''
        description: "Override the Python version Memgraph is built against (e.g. 3.12). Empty uses the default Python inside each build container."
      python_runtime_version:
        type: string
        default: ''
        description: "After building, remove the build Python and swap in this version (e.g. 3.13) so tests run the binary against a different libpython. Empty disables the swap."
  workflow_call:
    inputs:
      community_core:
        type: boolean
        default: true
        description: "Community: Core"
      coverage_core:
        type: boolean
        default: true
        description: "Coverage: Core"
      coverage_clang_tidy:
        type: boolean
        default: true
        description: "Coverage: Clang-Tidy"
      debug_core:
        type: boolean
        default: true
        description: "Debug: Core"
      debug_integration:
        type: boolean
        default: true
        description: "Debug: Integration"
      jepsen_core:
        type: boolean
        default: true
        description: "Jepsen: Core"
      release_core:
        type: boolean
        default: true
        description: "Release: Core"
      release_benchmark:
        type: boolean
        default: true
        description: "Release: Benchmark"
      release_e2e:
        type: boolean
        default: true
        description: "Release: E2E"
      release_stress:
        type: boolean
        default: true
        description: "Release: Stress"
      mage_amd:
        type: boolean
        default: true
        description: "MAGE: AMD"
      mage_arm:
        type: boolean
        default: true
        description: "MAGE: ARM"
      mage_cuda:
        type: boolean
        default: true
        description: "MAGE: CUDA"
      mgcxx_unit:
        type: boolean
        default: true
        description: "MGCXX: Unit"
      python_build_version:
        type: string
        default: ''
        description: "Override the Python version Memgraph is built against (e.g. 3.12). Empty uses the default Python inside each build container."
      python_runtime_version:
        type: string
        default: ''
        description: "After building, remove the build Python and swap in this version (e.g. 3.13) so tests run the binary against a different libpython. Empty disables the swap."
      ref:
        description: 'Branch or commit ref to run the workflow on'
        required: false
        default: ''
        type: string

jobs:
  DiffSetup:
    runs-on: ubuntu-latest
    outputs:
      run_community_core: ${{ steps.setup.outputs.run_community_core }}
      run_coverage_core: ${{ steps.setup.outputs.run_coverage_core }}
      run_coverage_clang_tidy: ${{ steps.setup.outputs.run_coverage_clang_tidy }}
      run_debug_core: ${{ steps.setup.outputs.run_debug_core }}
      run_debug_integration: ${{ steps.setup.outputs.run_debug_integration }}
      run_jepsen_core: ${{ steps.setup.outputs.run_jepsen_core }}
      run_release_core: ${{ steps.setup.outputs.run_release_core }}
      run_release_benchmark: ${{ steps.setup.outputs.run_release_benchmark}}
      run_release_e2e: ${{ steps.setup.outputs.run_release_e2e }}
      run_release_stress: ${{ steps.setup.outputs.run_release_stress }}
      run_mage_amd: ${{ steps.setup.outputs.run_mage_amd }}
      run_mage_arm: ${{ steps.setup.outputs.run_mage_arm }}
      run_mage_cuda: ${{ steps.setup.outputs.run_mage_cuda }}
      run_mgcxx_unit: ${{ steps.setup.outputs.run_mgcxx_unit }}
    env:
      GH_CONTEXT: ${{ toJson(github) }}
      GH_CONTEXT_FILE_NAME: github_context.json
    steps:
      - name: Set up repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Dump GitHub context
        run: echo "$GH_CONTEXT" >> "$GH_CONTEXT_FILE_NAME"
      - name: Set up diff execution
        id: setup
        run: ./tools/ci/diff_setup.py --gh-context-path "$GH_CONTEXT_FILE_NAME" --base-branch "origin/master"

  Community:
    needs: DiffSetup
    uses: ./.github/workflows/diff_community.yaml
    with:
      ref: ${{ inputs.ref || github.ref }}
      arch: 'amd'
      os: 'ubuntu-24.04'
      run_core: ${{ needs.DiffSetup.outputs.run_community_core }}
      python_build_version: ${{ inputs.python_build_version }}
      python_runtime_version: ${{ inputs.python_runtime_version }}
    secrets: inherit

  Coverage:
    needs: DiffSetup
    uses: ./.github/workflows/diff_coverage.yaml
    with:
      ref: ${{ inputs.ref || github.ref }}
      arch: 'amd'
      os: 'ubuntu-24.04'
      run_core: ${{ needs.DiffSetup.outputs.run_coverage_core }}
      run_clang_tidy: ${{ needs.DiffSetup.outputs.run_coverage_clang_tidy }}
      python_build_version: ${{ inputs.python_build_version }}
      python_runtime_version: ${{ inputs.python_runtime_version }}
    secrets: inherit

  Debug:
    needs: DiffSetup
    uses: ./.github/workflows/diff_debug.yaml
    with:
      ref: ${{ inputs.ref || github.ref }}
      arch: 'amd'
      os: 'ubuntu-24.04'
      run_core: ${{ needs.DiffSetup.outputs.run_debug_core }}
      run_integration: ${{ needs.DiffSetup.outputs.run_debug_integration }}
      python_build_version: ${{ inputs.python_build_version }}
      python_runtime_version: ${{ inputs.python_runtime_version }}
    secrets: inherit

  Jepsen:
    needs: DiffSetup
    uses: ./.github/workflows/diff_jepsen.yaml
    with:
      ref: ${{ inputs.ref || github.ref }}
      run_core: ${{ needs.DiffSetup.outputs.run_jepsen_core }}
    secrets: inherit

  Release:
    needs: DiffSetup
    uses: ./.github/workflows/diff_release.yaml
    with:
      ref: ${{ inputs.ref || github.ref }}
      arch: 'amd'
      os: 'ubuntu-24.04'
      run_core: ${{ needs.DiffSetup.outputs.run_release_core }}
      run_benchmark: ${{ needs.DiffSetup.outputs.run_release_benchmark }}
      run_e2e: ${{ needs.DiffSetup.outputs.run_release_e2e }}
      run_stress: ${{ needs.DiffSetup.outputs.run_release_stress }}
      python_build_version: ${{ inputs.python_build_version }}
      python_runtime_version: ${{ inputs.python_runtime_version }}
    secrets: inherit

  Mage:
    needs: DiffSetup
    uses: ./.github/workflows/diff_mage.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
      os: 'ubuntu-24.04'
      run_amd: ${{ needs.DiffSetup.outputs.run_mage_amd == 'true' }}
      run_arm: ${{ needs.DiffSetup.outputs.run_mage_arm == 'true' }}
      run_cuda: ${{ needs.DiffSetup.outputs.run_mage_cuda == 'true' }}
      # Mage only overrides the build-time Python; runtime stays the image
      # default, so no python_runtime_version (no swap) is forwarded.
      python_build_version: ${{ inputs.python_build_version }}
    secrets: inherit

  MGCXX:
    needs: DiffSetup
    uses: ./.github/workflows/diff_mgcxx.yml
    with:
      run_test: ${{ needs.DiffSetup.outputs.run_mgcxx_unit == 'true' }}
      ref: ${{ inputs.ref || github.ref }}
    secrets: inherit
