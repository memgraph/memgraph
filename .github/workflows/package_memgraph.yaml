name: Package memgraph

# Concurrency control: limit to one run per PR, but allow multiple manual runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


on:
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        type: choice
        description: "OS of the mgbuild container the build runs in (the packages themselves are distro-agnostic; use package_smoke_os to pick test targets). To produce a docker image, pick a ubuntu-24.04 variant and set build_docker_image."
        default: 'ubuntu-24.04'
        options:
          - centos-9
          - centos-10
          - debian-12
          - debian-12-arm
          - debian-13
          - debian-13-arm
          - fedora-43
          - fedora-43-arm
          - fedora-44
          - fedora-44-arm
          - fedora-45
          - fedora-45-arm
          - rocky-10
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-26.04
          - ubuntu-26.04-arm
      build_docker_image:
        type: choice
        description: "Docker image(s) to produce alongside the deb. 'none' (default), 'prod', 'debug' (relwithdebinfo, installs memgraph-debuginfo on top), or 'both'. Requires a ubuntu-24.04 os."
        default: 'none'
        options:
          - none
          - prod
          - debug
          - both
      push_to_s3:
        type: boolean
        description: "Push final packages to an S3 bucket?"
        default: false
      push_to_github:
        type: boolean
        description: "Push final packages to GitHub?"
        default: false
      s3_dest_dir:
        type: string
        description: "Target dir path in chosen S3 bucket, don't end the path with '/'. For bucket 'deps.memgraph.io' use format 'memgraph/vX.Y.Z'."
        default: 'memgraph-unofficial'
      malloc:
        type: boolean
        description: "Package malloc build?"
        default: false
      generate_sbom:
        type: boolean
        description: "Generate SBOM"
        default: false
      run_smoke_tests:
        type: boolean
        description: "Run smoke tests on images after building"
        default: false
      package_smoke_os:
        type: choice
        description: "Distro(s) to smoke test the built deb/rpm packages on (requires run_smoke_tests)."
        default: 'ubuntu-24.04'
        options:
          - all
          - all deb
          - all rpm
          - centos-9
          - centos-10
          - debian-12
          - debian-13
          - fedora-43
          - fedora-44
          - fedora-45
          - rocky-10
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04

  workflow_call:
    inputs:
      os:
        type: string
        description: "OS of the mgbuild container the build runs in (the packages themselves are distro-agnostic; use package_smoke_os to pick test targets). To produce a docker image, pick a ubuntu-24.04 variant and set build_docker_image."
        default: 'ubuntu-24.04'
      build_docker_image:
        type: string
        description: "Docker image(s) to produce alongside the deb: 'none' (default), 'prod', 'debug', or 'both'. Requires a ubuntu-24.04 os."
        default: 'none'
      toolchain:
        type: string
        description: "Toolchain version with which memgraph will be packaged."
        default: 'v6'
      push_to_s3:
        type: boolean
        description: "Push final packages to an S3 bucket?"
        default: false
      push_to_github:
        type: boolean
        description: "Push final packages to GitHub?"
        default: false
      s3_dest_dir:
        type: string
        description: "Target dir path in chosen S3 bucket, don't end the path with '/'. For bucket 'deps.memgraph.io' use format 'memgraph/vX.Y.Z'."
        default: ''
      ref:
        type: string
        description: "Branch or commit ref to run the workflow on"
        required: false
        default: ''
      malloc:
        type: boolean
        description: "Package malloc build?"
        default: false
      generate_sbom:
        type: boolean
        description: "Generate SBOM"
        default: false
      run_smoke_tests:
        type: boolean
        description: "Run smoke tests on images after building"
        default: false
      package_smoke_os:
        type: string
        description: "Distro(s) to smoke test the built deb/rpm packages on: 'all', 'all deb', 'all rpm', or a space-separated list of distros. Empty means the build container's OS."
        default: ''

jobs:
  PackageSetup:
    runs-on: ubuntu-latest
    outputs:
      run_package: ${{ steps.setup.outputs.run_package }}
      package_os: ${{ steps.setup.outputs.package_os }}
      package_arch: ${{ steps.setup.outputs.package_arch }}
      workflow_input_push_to_s3: ${{ steps.setup.outputs.workflow_input_push_to_s3 }}
      workflow_input_push_to_github: ${{ steps.setup.outputs.workflow_input_push_to_github }}
      workflow_input_s3_dest_dir: ${{ steps.setup.outputs.workflow_input_s3_dest_dir }}
      workflow_input_malloc: ${{ steps.setup.outputs.workflow_input_malloc }}
      workflow_input_generate_sbom: ${{ steps.setup.outputs.workflow_input_generate_sbom }}
      workflow_input_run_smoke_tests: ${{ steps.setup.outputs.workflow_input_run_smoke_tests }}
      workflow_input_package_smoke_os: ${{ steps.setup.outputs.workflow_input_package_smoke_os }}
      workflow_input_build_docker_image: ${{ steps.setup.outputs.workflow_input_build_docker_image }}
    env:
      GH_CONTEXT: ${{ toJson(github) }}
      GH_CONTEXT_FILE_NAME: github_context.json
    steps:
      - name: Set up repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Dump GitHub context
        run: echo "$GH_CONTEXT" >> "$GH_CONTEXT_FILE_NAME"
      - name: Set up package execution
        id: setup
        run: ./tools/ci/package_setup.py --gh-context-path "$GH_CONTEXT_FILE_NAME"

  # A single build produces both the deb and the rpm (the packages are
  # distro-agnostic), so one job covers every distro; package_smoke_os
  # decides where the packages get smoke tested.
  Package:
    needs: PackageSetup
    if: ${{ needs.PackageSetup.outputs.run_package == 'true' }}
    uses: ./.github/workflows/reusable_package.yaml
    with:
      os: ${{ needs.PackageSetup.outputs.package_os }}
      arch: ${{ needs.PackageSetup.outputs.package_arch }}
      build_type: RelWithDebInfo
      build_docker_image: ${{ needs.PackageSetup.outputs.workflow_input_build_docker_image }}
      push_to_s3: ${{ needs.PackageSetup.outputs.workflow_input_push_to_s3 }}
      print_output_url: true
      push_to_github: ${{ needs.PackageSetup.outputs.workflow_input_push_to_github }}
      additional_build_args: ${{ needs.PackageSetup.outputs.workflow_input_malloc == 'true' && '--disable-jemalloc' || '' }}
      s3_dest_dir: ${{ needs.PackageSetup.outputs.workflow_input_s3_dest_dir }}
      ref: ${{ inputs.ref || github.ref }}
      generate_sbom: ${{ needs.PackageSetup.outputs.workflow_input_generate_sbom == 'true' }}
      run_smoke_tests: ${{ needs.PackageSetup.outputs.workflow_input_run_smoke_tests == 'true' }}
      package_smoke_os: ${{ needs.PackageSetup.outputs.workflow_input_package_smoke_os }}
    secrets: inherit
