name: "PR Conflict Check"

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        type: number
        required: true
        description: "Number of the PR to check."

# One run per PR at a time, so quick successive pushes can't race to create
# two comments.
concurrency:
  group: pr-conflicts-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  CheckConflicts:
    # Fork PRs get a read-only token on pull_request, so skip them there. A
    # manual run has a full token, so it can check any PR.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate PR
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh pr view "$PR_NUMBER" --json state -q .state)
          if [[ "$state" != "OPEN" ]]; then
            echo "::error::#$PR_NUMBER is $state, not an open PR."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: List files touched by open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state open --limit 200 --json number,files > "$RUNNER_TEMP/open_prs.json"

      - name: Find conflicting PRs
        run: |
          python3 tools/ci/pr-conflicts/find_pr_conflicts.py \
            "$RUNNER_TEMP/open_prs.json" \
            "$PR_NUMBER" \
            "$RUNNER_TEMP/pr_conflicts.md"

      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          marker='<!-- pr-conflicts -->'
          message="$RUNNER_TEMP/pr_conflicts.md"

          # Find this workflow's earlier comment, if any, by its hidden marker.
          comment_id=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | head -n 1)

          # The script only writes the message when there are conflicts. With
          # none, clear an earlier warning so it doesn't go stale, or stay quiet.
          if [[ ! -f "$message" ]]; then
            if [[ -z "$comment_id" ]]; then
              exit 0
            fi
            printf '%s\nThis PR no longer modifies files that other open pull requests also modify.\n' "$marker" > "$message"
          fi

          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -F body=@"$message" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file "$message"
          fi
