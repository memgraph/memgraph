name: Daily Benchmark

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      loop_count:
        type: number
        description: "Number of times to run the benchmarks. Default is 10."
        default: 10
  schedule:
    - cron: "0 1 * * *"

jobs:
  release_benchmarks:
    name: "Daily benchmarks"
    runs-on: [self-hosted, Linux, benchmark]
    # TEMPORARY: only mgbench-ha runs, so the budget is that one suite. The figure below is an
    # estimate, not a measurement, which is why the margin is generous. Restore the original 550 when
    # the other steps are re-enabled, adjusted for whatever mgbench-ha turns out to cost.
    timeout-minutes: 400
    #  The timeout above is calculated based on a previous run where the loop count was 100
    #  Rough times per test:
    #  - mgbench-ha: 25 minutes (ESTIMATE, not yet measured: 10 queries at one five-process cluster
    #    restart each, plus a pokec import that replicates synchronously to one replica, and no
    #    authorization pass, which would double those restarts)
    #  - macro-benchmark: 3 minutes
    #  - mgbench: 20 minutes
    #  - extended planner improvements mgbench: 15 minutes
    #  - mgbench-supernode: 1.5 minute
    #  - mgbench-load-parquet: 4 minutes
    #  - mgbench-vector-search-index: 5 minutes
    #  - mgbench-vector-search-edge-index: 5 minutes
    #  - mgbench-text-search-index: 5 minutes
    #  - mgbench-text-search-edge-index: 5 minutes
    #  10 iterations of mgbench-ha alone would take about 250 minutes, leaving 150 minutes to allow
    #  for building memgraph and variations in benchmark times.
    env:
      ARCH: "amd"
      OS: "ubuntu-24.04"
      TOOLCHAIN: "v8"
      BUILD_TYPE: "RelWithDebInfo"
      MEMGRAPH_ENTERPRISE_LICENSE: ${{ secrets.MEMGRAPH_ENTERPRISE_LICENSE }}
      MEMGRAPH_ORGANIZATION_NAME: ${{ secrets.MEMGRAPH_ORGANIZATION_NAME }}
      DEFAULT_MGBENCH_EXPORT_RESULTS_FILE: 'benchmark_result.json'
      # Results of the high availability suite, which runs on its own and so reports under its own
      # benchmark name rather than as a field of the standalone measurement.
      DEFAULT_MGBENCH_HA_EXPORT_RESULTS_FILE: 'benchmark_result_ha.json'
      LOOP_COUNT: ${{ inputs.loop_count || 10 }}
      CONAN_REMOTE: ${{ secrets.CONAN_REMOTE }}
      CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
      CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}

    steps:
      - name: Set up repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Clean up Docker
        if: always()
        continue-on-error: true
        run: |
          ./tools/ci/docker_cleanup.sh

      - name: Log in to Docker Hub
        uses: ./.github/actions/docker-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Spin up mgbuild container
        run: |
          USE_CUSTOM_MIRROR="$(./tools/ci/ubuntu-mirrors/use_custom_mirror.sh --os "$OS" --arch "$ARCH")"
          ./release/package/mgbuild.sh \
          --toolchain $TOOLCHAIN \
          --os $OS \
          --arch $ARCH \
          run --custom-mirror $USE_CUSTOM_MIRROR

      - name: Build release binary
        run: |
          ./release/package/mgbuild.sh \
          --toolchain $TOOLCHAIN \
          --os $OS \
          --arch $ARCH \
          --build-type $BUILD_TYPE \
          build-memgraph \
          --split-debug \
          --conan-remote $CONAN_REMOTE \
          --conan-username $CONAN_USERNAME \
          --conan-password $CONAN_PASSWORD

      - name: Initialize tests
        run: |
          ./release/package/mgbuild.sh \
          --toolchain $TOOLCHAIN \
          --os $OS \
          --arch $ARCH \
          init-tests

      - name: Get branch name
        shell: bash
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            echo "BRANCH_NAME=$(echo ${GITHUB_HEAD_REF} | tr / -)" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr / -)" >> $GITHUB_ENV
          fi

      - name: Force container into first numa group
        run: |
          numagroup="$(./tools/ci/numa-0-cores.sh)"
          echo "Using numa group: $numagroup"
          docker update \
          --cpuset-cpus="$numagroup" \
          --cpuset-mems="0" \
          "mgbuild_${TOOLCHAIN}_${OS}"

      # TEMPORARY: while the high availability benchmark is being brought up, it runs first and on
      # its own, and every other benchmark step below is disabled with `if: false`. Re-enable them by
      # deleting those lines.
      - name: Run and upload mgbench-ha
        id: mgbench-ha
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-ha \
            mgbench-ha \
            ${{ env.DEFAULT_MGBENCH_HA_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload load_parquet benchmark
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: load-parquet
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-load-parquet \
            load-parquet \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME

      - name: Run and upload mgbench-vector-search-index
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-vector-search-index
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-vector-search-index \
            vector-search-index \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-vector-search-edge-index
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-vector-search-edge-index
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-vector-search-edge-index \
            vector-search-edge-index \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-text-search-index
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-text-search-index
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-text-search-index \
            text-search-index \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-text-search-edge-index
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-text-search-edge-index
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-text-search-edge-index \
            text-search-edge-index \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload macro benchmarks
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: macro-benchmark
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            macro-benchmark \
            macro_benchmark \
            .harness_summary \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            macro_benchmark

      - name: Run and upload mgbench-supernode
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-supernode
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-supernode \
            supernode \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench \
            mgbench \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run extended planner optimizations mgbench
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: planner
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            "mgbench --dataset pokec_planner_optimizations --size medium" \
            mgbench-planner-optimizations \
            benchmark_result_extended.json \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Stop mgbuild container
        if: always()
        run: |
          ./release/package/mgbuild.sh \
          --toolchain $TOOLCHAIN \
          --os $OS \
          --arch $ARCH \
          stop --remove

      - name: Clean up Docker
        if: always()
        continue-on-error: true
        run: |
          ./tools/ci/docker_cleanup.sh

      - name: Trigger Regression Detection Job
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/memgraph/infra/dispatches \
            -d "{\"event_type\": \"regression-detection\"}"

      - name: Set Job Status
        run: |
          success=${{ steps.macro-benchmark.outcome == 'success' && steps.mgbench-supernode.outcome == 'success' && steps.mgbench.outcome == 'success' && steps.planner.outcome == 'success' && steps.load-parquet.outcome == 'success' && steps.mgbench-vector-search-index.outcome == 'success' && steps.mgbench-vector-search-edge-index.outcome == 'success' && steps.mgbench-text-search-index.outcome == 'success' && steps.mgbench-text-search-edge-index.outcome == 'success' }}
          echo "success=$success" >> $GITHUB_OUTPUT
          if [ "$success" == "true" ]; then
            echo "All benchmarks succeeded"
          else
            echo "Some benchmarks failed"
            exit 1
          fi
