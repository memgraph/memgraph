name: Daily Benchmark

on:
  workflow_dispatch:
    inputs:
      loop_count:
        type: number
        description: "Number of times to run the benchmarks. Default is 10."
        default: 10
  schedule:
    - cron: "0 1 * * *"

jobs:
  release_benchmarks:
    name: "Daily benchmarks"
    # TEMPORARY: borrowed from the general build pool so the HA suite can be iterated on without
    # waiting for the single benchmark runner. Nothing measured here is comparable to a real result:
    # the pool is shared and not NUMA-pinned. Restore [self-hosted, Linux, benchmark] before trusting
    # a number, together with the numa step below.
    runs-on: [self-hosted, Linux, X64, DockerMgBuild]
    # TEMPORARY: only mgbench-ha runs, so the budget is that one suite. The figure below is an
    # estimate, not a measurement, which is why the margin is generous. Restore the original 550 when
    # the other steps are re-enabled, adjusted for whatever mgbench-ha turns out to cost.
    timeout-minutes: 600
    #  The timeout above is calculated based on a previous run where the loop count was 100
    #  Rough times per test:
    #  - mgbench-ha: 25 minutes (ESTIMATE, not yet measured: 6 queries at one five-process cluster
    #    restart each, plus a pokec import that replicates synchronously to one replica, and no
    #    authorization pass, which would double those restarts)
    #  - mgbench-ha-2-replicas: 30 minutes (ESTIMATE: the same suite with a second replica, so six
    #    processes to restart and every commit waiting for two acknowledgements instead of one)
    #  - mgbench-ha-async: 22 minutes (ESTIMATE: main does not wait at commit, so the measured part is
    #    faster, plus the post-measurement wait for the replica to drain)
    #  - mgbench-ha-strict-sync: 30 minutes (ESTIMATE: a commit that cannot reach the replica aborts
    #    rather than committing locally)
    #  - mgbench-ha-2-strict-sync: 35 minutes (ESTIMATE: as above, and it must reach both replicas)
    #  - mgbench-ha-2-async: 24 minutes (ESTIMATE: main waits for neither, plus draining both)
    #  - mgbench-ha-sync-async: 28 minutes (ESTIMATE: one acknowledgement, one replica trailing)
    #  - mgbench-ha-strict-sync-async: 32 minutes (ESTIMATE)
    #  - macro-benchmark: 3 minutes
    #  - mgbench: 20 minutes
    #  - extended planner improvements mgbench: 15 minutes
    #  - mgbench-supernode: 1.5 minute
    #  - mgbench-load-parquet: 4 minutes
    #  - mgbench-vector-search-index: 5 minutes
    #  - mgbench-vector-search-edge-index: 5 minutes
    #  - mgbench-text-search-index: 5 minutes
    #  - mgbench-text-search-edge-index: 5 minutes
    #  The eight high availability suites come to about 224 minutes for a single iteration, so the
    #  loop count is what decides whether this job is feasible at all: at 10 it would be roughly 37
    #  hours, far longer than the interval between nightly runs, and with no concurrency group the runs
    #  would overlap and collide on the cluster's fixed ports. The default is 2 while these suites are
    #  being brought up, which is about 450 minutes. Restoring the other benchmark steps, or raising the
    #  loop count, needs this arithmetic redone. Every figure above is an estimate, not a measurement.
    env:
      ARCH: "amd"
      OS: "ubuntu-24.04"
      TOOLCHAIN: "v8"
      BUILD_TYPE: "RelWithDebInfo"
      MEMGRAPH_ENTERPRISE_LICENSE: ${{ secrets.MEMGRAPH_ENTERPRISE_LICENSE }}
      MEMGRAPH_ORGANIZATION_NAME: ${{ secrets.MEMGRAPH_ORGANIZATION_NAME }}
      DEFAULT_MGBENCH_EXPORT_RESULTS_FILE: 'benchmark_result.json'
      # Results of the high availability suite, which runs on its own and so reports under its own
      # benchmark name rather than as a field of the standalone measurement.
      DEFAULT_MGBENCH_HA_EXPORT_RESULTS_FILE: 'benchmark_result_ha.json'
      # The same suite against a main with two SYNC replicas, so every commit waits for two
      # acknowledgements instead of one. Separate file and series, since the topology is what differs.
      DEFAULT_MGBENCH_HA_2_REPLICAS_EXPORT_RESULTS_FILE: 'benchmark_result_ha_2_replicas.json'
      # One ASYNC replica: main does not wait at commit, so throughput is near a single instance's and
      # the cost appears as lag. The runner waits for the replica to drain after the measurement.
      DEFAULT_MGBENCH_HA_ASYNC_EXPORT_RESULTS_FILE: 'benchmark_result_ha_async.json'
      # One STRICT_SYNC replica: a commit that cannot reach the replica aborts instead of committing
      # locally, so this is the strictest and most expensive single-replica topology.
      DEFAULT_MGBENCH_HA_STRICT_SYNC_EXPORT_RESULTS_FILE: 'benchmark_result_ha_strict_sync.json'
      # The remaining topologies, each its own suite and series so a mode's cost is a difference
      # between two of them rather than something inferred.
      DEFAULT_MGBENCH_HA_2_STRICT_SYNC_EXPORT_RESULTS_FILE: 'benchmark_result_ha_2_strict_sync.json'
      DEFAULT_MGBENCH_HA_2_ASYNC_EXPORT_RESULTS_FILE: 'benchmark_result_ha_2_async.json'
      DEFAULT_MGBENCH_HA_SYNC_ASYNC_EXPORT_RESULTS_FILE: 'benchmark_result_ha_sync_async.json'
      DEFAULT_MGBENCH_HA_STRICT_SYNC_ASYNC_EXPORT_RESULTS_FILE: 'benchmark_result_ha_strict_sync_async.json'
      LOOP_COUNT: ${{ inputs.loop_count || 2 }}
      CONAN_REMOTE: ${{ secrets.CONAN_REMOTE }}
      CONAN_USERNAME: ${{ secrets.CONAN_USERNAME }}
      CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}

    steps:
      - name: Set up repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Clean up Docker
        if: always()
        continue-on-error: true
        run: |
          ./tools/ci/docker_cleanup.sh

      - name: Log in to Docker Hub
        uses: ./.github/actions/docker-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Spin up mgbuild container
        run: |
          if [[ "$OS" == "ubuntu-24.04" ]]; then
            USE_CUSTOM_MIRROR=true
          else
            USE_CUSTOM_MIRROR=false
          fi
          ./release/package/mgbuild.sh \
          --toolchain $TOOLCHAIN \
          --os $OS \
          --arch $ARCH \
          run --custom-mirror $USE_CUSTOM_MIRROR

      - name: Build release binary
        run: |
          ./release/package/mgbuild.sh \
          --toolchain $TOOLCHAIN \
          --os $OS \
          --arch $ARCH \
          --build-type $BUILD_TYPE \
          build-memgraph \
          --split-debug \
          --conan-remote $CONAN_REMOTE \
          --conan-username $CONAN_USERNAME \
          --conan-password $CONAN_PASSWORD

      - name: Initialize tests
        run: |
          ./release/package/mgbuild.sh \
          --toolchain $TOOLCHAIN \
          --os $OS \
          --arch $ARCH \
          init-tests

      - name: Get branch name
        shell: bash
        run: |
          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            echo "BRANCH_NAME=$(echo ${GITHUB_HEAD_REF} | tr / -)" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | tr / -)" >> $GITHUB_ENV
          fi

      - name: Force container into first numa group
        # TEMPORARY: tolerated while the job runs on the borrowed build pool, where the node0 cpulist
        # the script needs is not guaranteed. Pinning is pointless on a shared runner anyway, and a
        # missing cpulist must not kill the job before a benchmark runs. Drop this with the runs-on
        # change above.
        continue-on-error: true
        run: |
          numagroup="$(./tools/ci/numa-0-cores.sh)"
          echo "Using numa group: $numagroup"
          docker update \
          --cpuset-cpus="$numagroup" \
          --cpuset-mems="0" \
          "mgbuild_${TOOLCHAIN}_${OS}"

      # TEMPORARY: while the high availability benchmark is being brought up, it runs first and on
      # its own, and every other benchmark step below is disabled with `if: false`. Re-enable them by
      # deleting those lines.
      - name: Run and upload mgbench-ha
        id: mgbench-ha
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-ha \
            mgbench-ha \
            ${{ env.DEFAULT_MGBENCH_HA_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-ha-2-replicas
        id: mgbench-ha-2-replicas
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            "mgbench-ha --cluster-description ha_cluster_2_replicas.yaml" \
            mgbench-ha-2-replicas \
            ${{ env.DEFAULT_MGBENCH_HA_2_REPLICAS_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-ha-async
        id: mgbench-ha-async
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            "mgbench-ha --cluster-description ha_cluster_async.yaml" \
            mgbench-ha-async \
            ${{ env.DEFAULT_MGBENCH_HA_ASYNC_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-ha-strict-sync
        id: mgbench-ha-strict-sync
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            "mgbench-ha --cluster-description ha_cluster_strict_sync.yaml" \
            mgbench-ha-strict-sync \
            ${{ env.DEFAULT_MGBENCH_HA_STRICT_SYNC_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-ha-2-strict-sync
        id: mgbench-ha-2-strict-sync
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            "mgbench-ha --cluster-description ha_cluster_2_strict_sync.yaml" \
            mgbench-ha-2-strict-sync \
            ${{ env.DEFAULT_MGBENCH_HA_2_STRICT_SYNC_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-ha-2-async
        id: mgbench-ha-2-async
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            "mgbench-ha --cluster-description ha_cluster_2_async.yaml" \
            mgbench-ha-2-async \
            ${{ env.DEFAULT_MGBENCH_HA_2_ASYNC_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-ha-sync-async
        id: mgbench-ha-sync-async
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            "mgbench-ha --cluster-description ha_cluster_sync_async.yaml" \
            mgbench-ha-sync-async \
            ${{ env.DEFAULT_MGBENCH_HA_SYNC_ASYNC_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-ha-strict-sync-async
        id: mgbench-ha-strict-sync-async
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            "mgbench-ha --cluster-description ha_cluster_strict_sync_async.yaml" \
            mgbench-ha-strict-sync-async \
            ${{ env.DEFAULT_MGBENCH_HA_STRICT_SYNC_ASYNC_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload load_parquet benchmark
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: load-parquet
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-load-parquet \
            load-parquet \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME

      - name: Run and upload mgbench-vector-search-index
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-vector-search-index
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-vector-search-index \
            vector-search-index \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-vector-search-edge-index
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-vector-search-edge-index
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-vector-search-edge-index \
            vector-search-edge-index \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-text-search-index
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-text-search-index
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-text-search-index \
            text-search-index \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench-text-search-edge-index
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-text-search-edge-index
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-text-search-edge-index \
            text-search-edge-index \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload macro benchmarks
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: macro-benchmark
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            macro-benchmark \
            macro_benchmark \
            .harness_summary \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            macro_benchmark

      - name: Run and upload mgbench-supernode
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench-supernode
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench-supernode \
            supernode \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run and upload mgbench
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: mgbench
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            mgbench \
            mgbench \
            ${{ env.DEFAULT_MGBENCH_EXPORT_RESULTS_FILE }} \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Run extended planner optimizations mgbench
        if: false  # TEMPORARY: disabled while the HA benchmark is brought up
        id: planner
        continue-on-error: true
        run: |
          ./tools/ci/loop-benchmark.sh \
            "mgbench --dataset pokec_planner_optimizations --size medium" \
            mgbench-planner-optimizations \
            benchmark_result_extended.json \
            ${{ github.run_id }} \
            ${{ github.run_number }} \
            $BRANCH_NAME \
            mgbench

      - name: Stop mgbuild container
        if: always()
        run: |
          ./release/package/mgbuild.sh \
          --toolchain $TOOLCHAIN \
          --os $OS \
          --arch $ARCH \
          stop --remove

      - name: Clean up Docker
        if: always()
        continue-on-error: true
        run: |
          ./tools/ci/docker_cleanup.sh

      - name: Trigger Regression Detection Job
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GITHUB_TOKEN" \
            https://api.github.com/repos/memgraph/infra/dispatches \
            -d "{\"event_type\": \"regression-detection\"}"

      - name: Set Job Status
        run: |
          # Only an explicit failure fails the job. A step disabled with `if: false`, or never
          # reached, reports "skipped" or nothing, and must not be read as a failed benchmark.
          check() {
            case "$2" in
              failure) echo "FAILED   $1"; failed="$failed $1" ;;
              success) echo "ok       $1" ;;
              *)       echo "skipped  $1" ;;
            esac
          }
          failed=""
          check mgbench-ha                       "${{ steps.mgbench-ha.outcome }}"
          check load-parquet                     "${{ steps.load-parquet.outcome }}"
          check mgbench-vector-search-index      "${{ steps.mgbench-vector-search-index.outcome }}"
          check mgbench-vector-search-edge-index "${{ steps.mgbench-vector-search-edge-index.outcome }}"
          check mgbench-text-search-index        "${{ steps.mgbench-text-search-index.outcome }}"
          check mgbench-text-search-edge-index   "${{ steps.mgbench-text-search-edge-index.outcome }}"
          check macro-benchmark                  "${{ steps.macro-benchmark.outcome }}"
          check mgbench-supernode                "${{ steps.mgbench-supernode.outcome }}"
          check mgbench                          "${{ steps.mgbench.outcome }}"
          check planner                          "${{ steps.planner.outcome }}"
          if [ -n "$failed" ]; then
            echo "success=false" >> $GITHUB_OUTPUT
            echo "Failed benchmarks:$failed"
            exit 1
          fi
          echo "success=true" >> $GITHUB_OUTPUT
          echo "All benchmarks that ran succeeded"
